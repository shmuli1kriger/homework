<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="controls">
        <div id="leftButtonBar">
            <button id="volumeButton"></button>
            <button id="viewSavedButton">View Saved Pictures</button>
        </div>
        <div id="rightButtonBar">
            <button id="saveButton">save</button>
            <button id="resetButton">reset</button>
        </div>
        
    </div>
    <div id="main">
        <img src="src/assets/potato.png" id="potato">
    </div>
    <div id="parts">
        <button id="partsButton">parts</button>
        <button id="hatsButton">hats</button>
        <button id="eyesButton">eyes</button>
        <button id="earsButton">ears</button>
        <button id="nosesButton">noses</button>
        <button id="mouthsButton">mouths</button>
        <button id="handsButton">hands</button>
        <button id="feetButton">feet</button>
    </div>
    <div id="savedPicturesBox">
        <button id="xButton">X</button>
        <button id="clearHistoryButton">Clear All History</button>
        <ul id="savedPicturesList"></ul>
    </div>
    <div id="modal"></div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
