<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="MrPotatoHead.css">
</head>
<body>
    <div id="controls">
        <audio src="music/music.mp3" id="gameMusic" preload="auto" autoplay loop>
            <source src="calm-game-music.mp3" type="audio/mpeg">
            <source src="calm-game-music.ogg" type="audio/ogg">
            Your browser does not support the audio element.
        </audio>
    </div>
    <div id="main">
        <img src="images/potato.png" id="potato">
    </div>
    <div id="parts">
        <button id="partsButton">parts</button>
        <button id="hatsButton">hats</button>
        <button id="eyesButton">eyes</button>
        <button id="earsButton">ears</button>
        <button id="nosesButton">noses</button>
        <button id="mouthsButton">mouths</button>
        <button id="handsButton">hands</button>
        <button id="feetButton">feet</button>
    </div>


    <script type="module" src="MrPotatoHead.js"></script>

</html>
