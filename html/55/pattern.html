        body{
            height: 1000px;
            display: grid;
            grid-template-columns: 1fr 50px 50px 1fr;
            grid-template-rows: 1fr 50px 50px 1fr;

        } .green{
            background-color: green;
            grid-column: 1/3;
            grid-row: 2/3;
            
        }
        .green2{
            background-color: green;
            grid-column: 1/3;
            grid-row: 3/4;
            order: 4
        }
        .red{
            background-color: red;
            grid-column: 2/4;
            grid-row: 1/3;
            order: 1;
        }
       
        .purple{
            background-color: purple;
            grid-column: 3/5;
            grid-row: 2/4;
            order: 2;
        }
        .brown{
            background-color: brown;
            grid-column: 2/4;
            grid-row: 3/5;
            order: 3;
        }
    </style>
</head>
<body>
    <section class="red"></section>
    <section class="green"></section>
    <section class="green2"></section>
    <section class="purple"></section>
    <section class="brown"></section>

</body>
