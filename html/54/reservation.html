    <a href="index.html">
        <img src="images/logo.png" alt="At Steak Logo" class="logo">
    </a>
    <form method="post">
        <label for="name">Name:</label>
        <input type="text" name="name" id="name" required minlength="2" placeholder="Enter Name">
        <label for="phone">Phone:</label>
        <input type="tel" name="tel" id="tel" 
            pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}$" 
            title="Please enter a valid 10-digit US/Canada phone number"  
            placeholder="xxx-xxx-xxxx" required/>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="Enter your email" required/>
        <label for="number">Number of Guests:</label>
        <input type="number" name="number" id="number" min="0" max="30" step="1" value="0" required/>
        <label for="date">Date: </label>
        <input type="date" name="date" id="date" min="2026-01-01" max="2028-12-31" value="2026-07-06" required/>
        <label for="time">Time:</label>
        <input type="time" name="time" id="time" min="17:00" max="23:59" required> 
        <input type="submit">
    </form>
